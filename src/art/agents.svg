<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1600" fill="none" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="ai-g1" cx="50%" cy="20%" r="58%">
      <stop offset="0%" stop-color="#9ad0d4" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#9ad0d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ai-g2" cx="20%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#4a3a2c" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#4a3a2c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="2000" height="1600" fill="#121110"/>
  <rect width="2000" height="1600" fill="url(#ai-g1)"/>
  <rect width="2000" height="1600" fill="url(#ai-g2)"/>
  <!-- three scenario portals, no copy -->
  <g class="ai-tiles">
    <g class="ai-tile" transform="translate(250 360)">
      <rect width="460" height="520" rx="32" fill="#1a1a1c"/>
      <rect x="14" y="14" width="432" height="492" rx="22" fill="#0e1011"/>
      <!-- sun / morning -->
      <g transform="translate(230 250)" stroke="#cfe8ea" fill="none" stroke-width="3.5" stroke-linecap="round">
        <circle r="48" stroke-opacity=".85"/>
        <path d="M0 -88 V-70" stroke-opacity=".55"/>
        <path d="M0 88 V70" stroke-opacity=".55"/>
        <path d="M88 0 H70" stroke-opacity=".55"/>
        <path d="M-88 0 H-70" stroke-opacity=".55"/>
        <path d="M62 -62 L50 -50" stroke-opacity=".55"/>
        <path d="M62 62 L50 50" stroke-opacity=".55"/>
        <path d="M-62 -62 L-50 -50" stroke-opacity=".55"/>
        <path d="M-62 62 L-50 50" stroke-opacity=".55"/>
      </g>
      <rect x="150" y="400" width="160" height="4" rx="2" fill="#9ad0d4" opacity=".45"/>
    </g>
    <g class="ai-tile" transform="translate(770 360)">
      <rect width="460" height="520" rx="32" fill="#1a1a1c"/>
      <rect x="14" y="14" width="432" height="492" rx="22" fill="#0e1011"/>
      <!-- calendar / schedule -->
      <g transform="translate(230 250)" stroke="#cfe8ea" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-70" y="-58" width="140" height="124" rx="14" stroke-opacity=".85"/>
        <path d="M-70 -28 H70" stroke-opacity=".85"/>
        <path d="M-36 -76 V-46" stroke-opacity=".55"/>
        <path d="M36 -76 V-46" stroke-opacity=".55"/>
        <g fill="#cfe8ea" stroke="none" opacity=".5">
          <rect x="-40" y="-4" width="16" height="16" rx="3"/>
          <rect x="-8" y="-4" width="16" height="16" rx="3"/>
          <rect x="24" y="-4" width="16" height="16" rx="3"/>
          <rect x="-40" y="28" width="16" height="16" rx="3"/>
          <rect x="-8" y="28" width="16" height="16" rx="3"/>
        </g>
      </g>
      <rect x="150" y="400" width="160" height="4" rx="2" fill="#9ad0d4" opacity=".45"/>
    </g>
    <g class="ai-tile" transform="translate(1290 360)">
      <rect width="460" height="520" rx="32" fill="#1a1a1c"/>
      <rect x="14" y="14" width="432" height="492" rx="22" fill="#0e1011"/>
      <!-- speech — support, empty bubble, no invented message -->
      <g transform="translate(230 250)" stroke="#cfe8ea" fill="none" stroke-width="3.5" stroke-linejoin="round">
        <path d="M-86 -40 C-86 -78 -50 -104 0 -104 C50 -104 86 -78 86 -40 C86 -2 50 24 16 24 L0 64 L-8 24 C-52 24 -86 -2 -86 -40 Z" stroke-opacity=".85"/>
      </g>
      <rect x="150" y="400" width="160" height="4" rx="2" fill="#9ad0d4" opacity=".45"/>
    </g>
  </g>
  <!-- connecting lines to a prompt field -->
  <g stroke="#9ad0d4" stroke-opacity=".28" stroke-width="2" fill="none">
    <path d="M480 880 V1000 H1000"/>
    <path d="M1000 880 V1000"/>
    <path d="M1520 880 V1000 H1000"/>
  </g>
  <!-- command bar with caret, no invented prompt text -->
  <g transform="translate(430 1040)">
    <rect width="1140" height="96" rx="24" fill="#1a1a1c"/>
    <rect x="8" y="8" width="1124" height="80" rx="18" fill="#0e1011" stroke="#9ad0d4" stroke-opacity=".28"/>
    <rect class="ai-caret" x="44" y="30" width="3" height="36" rx="1.5" fill="#cfe8ea"/>
  </g>
</svg>
