        <g transform="translate(0 96)" opacity=".6"><rect width="64" height="64" rx="10" opacity=".35"/><rect x="88" y="18" width="200" height="12" rx="6" opacity=".5"/><rect x="88" y="38" width="120" height="8" rx="4" opacity=".22"/></g>
