        <g transform="translate(0 288)" opacity=".4"><rect width="64" height="64" rx="10" opacity=".35"/><rect x="88" y="18" width="180" height="12" rx="6" opacity=".5"/><rect x="88" y="38" width="130" height="8" rx="4" opacity=".22"/></g>
      </g>
