        <rect x="72" y="10" width="44" height="110" rx="8" opacity=".5"/>
        <rect x="144" y="28" width="44" height="92" rx="8" opacity=".36"/>
        <rect x="216" y="54" width="44" height="66" rx="8" opacity=".22"/>
