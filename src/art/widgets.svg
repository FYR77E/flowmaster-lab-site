        <!-- 10:10 pose -->
        <path d="M0 0 L-46 -78" stroke="#f4f1ea" stroke-width="6" stroke-linecap="round"/>
        <path d="M0 0 L46 -78" stroke="#f4f1ea" stroke-width="5" stroke-linecap="round"/>
