          <path d="M0 -118 V-100"/><path d="M0 118 V100"/>
          <path d="M118 0 H100"/><path d="M-118 0 H-100"/>
          <path d="M83.4 -83.4 L71 -71"/><path d="M83.4 83.4 L71 71"/>
          <path d="M-83.4 -83.4 L-71 -71"/><path d="M-83.4 83.4 L-71 71"/>
