      <rect width="460" height="500" rx="28" fill="#1a1a1c"/>
      <rect x="14" y="14" width="432" height="472" rx="18" fill="#0e0f10"/>
      <g transform="translate(70 80)" stroke="#d7e3dc" fill="none" stroke-width="2.5" stroke-linecap="round" opacity=".45">
