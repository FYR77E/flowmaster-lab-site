<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1600" fill="none" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="wg-g1" cx="20%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#8fb3a0" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#8fb3a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wg-g2" cx="88%" cy="88%" r="50%">
      <stop offset="0%" stop-color="#5a3d2c" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#5a3d2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wg-media" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d4a46"/>
      <stop offset="100%" stop-color="#1c2422"/>
    </linearGradient>
  </defs>
  <rect width="2000" height="1600" fill="#121110"/>
  <rect width="2000" height="1600" fill="url(#wg-g1)"/>
  <rect width="2000" height="1600" fill="url(#wg-g2)"/>
  <g class="wg-grid">
